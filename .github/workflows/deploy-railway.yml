name: Deploy Medusa API

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway QA
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_CI: "1"
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::Skipping Medusa QA deploy because RAILWAY_TOKEN is not configured yet."
            exit 0
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Missing Railway project id"
            echo "Set RAILWAY_PROJECT_ID as an environment secret for the qa environment."
            exit 1
          fi
          railway up ./apps/medusa --path-as-root --service medusa --environment qa --project "$RAILWAY_PROJECT_ID" --ci
          curl --fail --silent --show-error https://medusa-qa.up.railway.app/health
