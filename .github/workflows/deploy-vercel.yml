name: Deploy Storefront

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - production

jobs:
  deploy-qa:
    if: github.event.inputs.target == 'qa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: qa
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@54.2.0

      - name: Deploy QA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Skipping storefront QA deploy because VERCEL_TOKEN is not configured yet."
            exit 0
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel org id or project id"
            echo "Set VERCEL_ORG_ID and VERCEL_PROJECT_ID as qa environment variables."
            exit 1
          fi
          args=(--yes --prod --cwd ./apps/storefront --token "$VERCEL_TOKEN")
          vercel deploy "${args[@]}"

  deploy-production:
    if: github.event.inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@54.2.0

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Skipping storefront production deploy because VERCEL_TOKEN is not configured yet."
            exit 0
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel org id or project id"
            echo "Set VERCEL_ORG_ID and VERCEL_PROJECT_ID as production environment variables."
            exit 1
          fi
          args=(--yes --prod --cwd ./apps/storefront --token "$VERCEL_TOKEN")
          vercel deploy "${args[@]}"
