name: Deploy Storefront

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - production

jobs:
  deploy-qa:
    if: github.event_name == 'push' || github.event.inputs.target == 'qa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: qa
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy QA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          MEDUSA_BACKEND_URL: ${{ vars.MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Skipping storefront QA deploy because VERCEL_TOKEN is not configured yet."
            exit 0
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel org id or project id"
            echo "Set VERCEL_ORG_ID and VERCEL_PROJECT_ID as qa environment variables."
            exit 1
          fi
          args=(--yes --cwd ./apps/storefront --target=preview --token "$VERCEL_TOKEN")
          [ -n "$MEDUSA_BACKEND_URL" ] && args+=(--env "MEDUSA_BACKEND_URL=$MEDUSA_BACKEND_URL" --build-env "MEDUSA_BACKEND_URL=$MEDUSA_BACKEND_URL")
          [ -n "$NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY" ] && args+=(--env "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY" --build-env "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY")
          [ -n "$NEXT_PUBLIC_RAZORPAY_KEY_ID" ] && args+=(--env "NEXT_PUBLIC_RAZORPAY_KEY_ID=$NEXT_PUBLIC_RAZORPAY_KEY_ID" --build-env "NEXT_PUBLIC_RAZORPAY_KEY_ID=$NEXT_PUBLIC_RAZORPAY_KEY_ID")
          [ -n "$NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN" ] && args+=(--env "NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN=$NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN" --build-env "NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN=$NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN")
          vercel deploy "${args[@]}"

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          MEDUSA_BACKEND_URL: ${{ vars.MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Skipping storefront production deploy because VERCEL_TOKEN is not configured yet."
            exit 0
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel org id or project id"
            echo "Set VERCEL_ORG_ID and VERCEL_PROJECT_ID as production environment variables."
            exit 1
          fi
          args=(--yes --prod --cwd ./apps/storefront --token "$VERCEL_TOKEN")
          [ -n "$MEDUSA_BACKEND_URL" ] && args+=(--env "MEDUSA_BACKEND_URL=$MEDUSA_BACKEND_URL" --build-env "MEDUSA_BACKEND_URL=$MEDUSA_BACKEND_URL")
          [ -n "$NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY" ] && args+=(--env "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY" --build-env "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY")
          [ -n "$NEXT_PUBLIC_RAZORPAY_KEY_ID" ] && args+=(--env "NEXT_PUBLIC_RAZORPAY_KEY_ID=$NEXT_PUBLIC_RAZORPAY_KEY_ID" --build-env "NEXT_PUBLIC_RAZORPAY_KEY_ID=$NEXT_PUBLIC_RAZORPAY_KEY_ID")
          [ -n "$NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN" ] && args+=(--env "NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN=$NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN" --build-env "NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN=$NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN")
          vercel deploy "${args[@]}"
